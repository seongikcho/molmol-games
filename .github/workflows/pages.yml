name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode binary assets and clean up obsolete files
        run: |
          CHANGED=0
          if ls assets/space-guardians.png.b64* >/dev/null 2>&1; then
            cat assets/space-guardians.png.b64* | base64 -d > assets/space-guardians.png
            rm -f assets/space-guardians.png.b64*
            CHANGED=1
          fi
          if ls assets/chogeomhaeng.png.b64* >/dev/null 2>&1; then
            cat assets/chogeomhaeng.png.b64* | base64 -d > assets/chogeomhaeng.png
            rm -f assets/chogeomhaeng.png.b64*
            CHANGED=1
          fi
          for old_path in about.html games.html ir.html news.html news-detail.html recruit.html store.html contact.html css js .github/workflows/decode-pngs.yml assets/cotton-revenant.svg assets/dungeon-alchemist.svg assets/molmol-island.svg assets/og-cover.svg assets/starlight-odyssey.svg; do
            if [ -e "$old_path" ]; then
              git rm -rf --ignore-unmatch "$old_path" || rm -rf "$old_path"
              CHANGED=1
            fi
          done
          if [ "$CHANGED" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: finalize binary PNG assets and clean up legacy files [skip ci]"
              git push origin HEAD:main
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
