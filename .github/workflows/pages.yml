name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode binary assets
        run: |
          CHANGED=0
          for bin_name in space-guardians.png chogeomhaeng.png earth-texture.jpg earth-night.jpg hero-studio.jpg; do
            if ls assets/${bin_name}.b64* >/dev/null 2>&1; then
              cat assets/${bin_name}.b64* | base64 -d > assets/${bin_name}
              rm -f assets/${bin_name}.b64*
              CHANGED=1
            fi
          done
          if [ -f assets/chogeomhaeng.png ]; then
            cp -f assets/chogeomhaeng.png assets/chogeomhaeng-white.png
          fi
          if [ "$CHANGED" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: decode white-background chogeomhaeng.png and binary assets [skip ci]"
              git push origin HEAD:main
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
