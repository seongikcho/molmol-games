name: Decode PNG assets
on:
  push:
    paths:
      - 'assets/*.png.b64'
      - '.github/workflows/decode-pngs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 PNGs to binary
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in assets/*.png.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            echo "Decoded $f -> $out ($(wc -c < "$out") bytes)"
            # verify PNG magic: 89 50 4E 47
            python3 -c "import sys; b=open(sys.argv[1],'rb').read(8); assert b==bytes.fromhex('89504e470d0a1a0a'), b; print('magic OK', sys.argv[1], 'size', __import__('os').path.getsize(sys.argv[1]))" "$out"
          done
      - name: Commit decoded PNGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.png
          if git diff --staged --quiet; then
            echo "No PNG changes"
            exit 0
          fi
          git commit -m "Add decoded PNG logo assets (binary)"
          git push
