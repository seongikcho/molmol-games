name: Decode PNG assets
on:
  push:
    paths:
      - 'assets/logo-molmol.svg'
      - 'assets/*.png.b64'
      - 'assets/*.png.b64.part*'
      - '.github/workflows/decode-pngs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract PNG from SVG / assemble b64 parts
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re, base64, pathlib, shutil
          root = pathlib.Path('assets')
          # Fix known typo in part04 if present (Vz->Us at critical site)
          p4 = root / 'logo-molmol.png.b64.part04'
          if p4.exists():
              t = p4.read_text()
              if 'Vz4emdH' in t:
                  p4.write_text(t.replace('Vz4emdH', 'Us4emdH', 1))
                  print('fixed part04 Vz->Us')
          svg_path = root / 'logo-molmol.svg'
          if svg_path.exists():
              svg = svg_path.read_text(encoding='utf-8')
              m = re.search(r'data:image/png;base64,([A-Za-z0-9+/=]+)', svg)
              if m:
                  png = base64.b64decode(m.group(1))
                  assert png[:8] == bytes.fromhex('89504e470d0a1a0a')
                  (root / 'logo-molmol.png').write_bytes(png)
                  print('extracted logo-molmol.png from svg', len(png))
          for name in ['logo-molmol.png', 'favicon.png', 'apple-touch-icon.png']:
              if name == 'logo-molmol.png' and (root / name).exists() and (root / name).stat().st_size > 1000:
                  # prefer svg extract if already written
                  if not list(root.glob(f'{name}.b64.part*')) and not (root / f'{name}.b64').exists():
                      print('keep svg-extracted', name)
                      continue
              b64p = root / f'{name}.b64'
              parts = sorted(root.glob(f'{name}.b64.part*'))
              if parts:
                  data = ''.join(p.read_text().strip() for p in parts)
                  b64p.write_text(data + '\n')
                  print('assembled', b64p, 'from', len(parts), 'parts')
              if b64p.exists():
                  raw = base64.b64decode(re.sub(r'\s+', '', b64p.read_text()))
                  assert raw[:8] == bytes.fromhex('89504e470d0a1a0a'), (name, raw[:8])
                  (root / name).write_bytes(raw)
                  print('wrote', name, len(raw))
          # ensure favicon/apple exist
          logo = root / 'logo-molmol.png'
          for name in ['favicon.png', 'apple-touch-icon.png']:
              if not (root / name).exists() and logo.exists():
                  shutil.copyfile(logo, root / name)
                  print('copied logo to', name)
          assert logo.exists() and logo.stat().st_size > 1000
          print('final logo', logo.stat().st_size)
          PY
      - name: Commit decoded PNGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo-molmol.png assets/favicon.png assets/apple-touch-icon.png || true
          if git diff --staged --quiet; then
            echo "No PNG changes"
            exit 0
          fi
          git commit -m "Add decoded PNG logo assets (binary)"
          git push
