name: Decode PNG assets
on:
  push:
    paths:
      - 'assets/*.png.b64'
      - 'assets/*.png.b64.part*'
      - '.github/workflows/decode-pngs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble parts and decode PNGs
        run: |
          set -euo pipefail
          shopt -s nullglob
          for name in logo-molmol.png favicon.png apple-touch-icon.png; do
            b64="assets/${name}.b64"
            parts=(assets/${name}.b64.part*)
            if [ ${#parts[@]} -gt 0 ]; then
              mapfile -t sorted < <(printf '%s\n' "${parts[@]}" | sort)
              cat "${sorted[@]}" > "$b64"
              echo "Assembled $b64 from ${#sorted[@]} parts ($(wc -c < "$b64") bytes)"
            fi
            if [ ! -f "$b64" ]; then
              echo "skip $name (no b64)"
              continue
            fi
            out="assets/${name}"
            tr -d '\n\r\t ' < "$b64" | base64 -d > "$out"
            python3 -c "import sys; b=open(sys.argv[1],'rb').read(8); assert b==bytes.fromhex('89504e470d0a1a0a'), b; print('magic OK', sys.argv[1], 'size', __import__('os').path.getsize(sys.argv[1]))" "$out"
          done
      - name: Commit decoded PNGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo-molmol.png assets/favicon.png assets/apple-touch-icon.png || true
          if git diff --staged --quiet; then
            echo "No PNG changes"
            exit 0
          fi
          git commit -m "Add decoded PNG logo assets (binary)"
          git push
